<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 180" role="img" aria-labelledby="title desc">
  <title id="title">Research dashboard banner</title>
  <desc id="desc">A hacker-style research dashboard banner with non-redundant content.</desc>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040804"/>
      <stop offset="100%" stop-color="#081108"/>
    </linearGradient>

    <radialGradient id="glow-bg" cx="82%" cy="32%" r="40%">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="divider-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,255,65,0.00)"/>
      <stop offset="15%" stop-color="rgba(0,255,65,0.18)"/>
      <stop offset="85%" stop-color="rgba(0,255,65,0.18)"/>
      <stop offset="100%" stop-color="rgba(0,255,65,0.00)"/>
    </linearGradient>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="micro-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#00ff41" stroke-opacity="0.045" stroke-width="0.6"/>
    </pattern>

    <pattern id="scanlines" x="0" y="0" width="960" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="960" height="1" fill="#000000" fill-opacity="0.14"/>
    </pattern>

    <style>
      .mono { font-family: 'Courier New', Courier, monospace; }
      .hud  { fill: #00ff41; }
      .dim  { fill: #3fbf63; }
      .soft { fill: #1f7f35; }
      .faint { fill: #0f4f1f; }
      .line { stroke: #00ff41; stroke-opacity: 0.15; stroke-width: 1; }
      .box  { fill: rgba(0,255,65,0.05); stroke: rgba(0,255,65,0.24); stroke-width: 1; }
      .tiny { font-size: 9px; letter-spacing: 1.3px; }
      .small { font-size: 11px; letter-spacing: 0.7px; }
      .body { font-size: 13px; }
      .head { font-size: 18px; font-weight: 700; letter-spacing: 1.5px; }
    </style>
  </defs>

  <!-- background -->
  <rect width="960" height="180" rx="12" fill="url(#bg)"/>
  <rect width="960" height="180" rx="12" fill="url(#micro-grid)"/>
  <rect width="960" height="180" rx="12" fill="url(#glow-bg)"/>

  <!-- frame -->
  <rect x="1" y="1" width="958" height="178" rx="11" fill="none" stroke="#00ff41" stroke-opacity="0.24" stroke-width="1"/>
  <rect x="5" y="5" width="950" height="170" rx="8" fill="none" stroke="#00ff41" stroke-opacity="0.06" stroke-width="1"/>

  <!-- corner brackets -->
  <path d="M18 34V16H36" fill="none" stroke="#00ff41" stroke-opacity="0.50" stroke-width="1.5"/>
  <path d="M924 16H942V34" fill="none" stroke="#00ff41" stroke-opacity="0.50" stroke-width="1.5"/>
  <path d="M18 146V164H36" fill="none" stroke="#00ff41" stroke-opacity="0.50" stroke-width="1.5"/>
  <path d="M924 164H942V146" fill="none" stroke="#00ff41" stroke-opacity="0.50" stroke-width="1.5"/>

  <!-- header -->
  <text x="34" y="28" class="mono faint tiny">// LIVE RESEARCH DASHBOARD · SIGNAL OVERVIEW · ACTIVE MODULES</text>
  <line x1="34" y1="36" x2="926" y2="36" class="line"/>

  <!-- left panel -->
  <text x="40" y="58" class="mono hud head" filter="url(#soft-glow)">system.map()</text>
  <text x="40" y="76" class="mono dim small">mapping themes and methods instead of repeating profile metadata</text>

  <!-- module rows -->
  <rect x="40" y="88" width="388" height="18" rx="3" class="box"/>
  <text x="52" y="101" class="mono hud body">[OK]</text>
  <text x="102" y="101" class="mono dim body">climate adaptation</text>

  <rect x="40" y="112" width="388" height="18" rx="3" class="box"/>
  <text x="52" y="125" class="mono hud body">[OK]</text>
  <text x="102" y="125" class="mono dim body">migration and displacement</text>

  <rect x="40" y="136" width="388" height="18" rx="3" class="box"/>
  <text x="52" y="149" class="mono hud body">[OK]</text>
  <text x="102" y="149" class="mono dim body">policy, livelihoods, digital literacy</text>

  <!-- center divider -->
  <rect x="468" y="46" width="1.5" height="108" fill="url(#divider-fade)"/>

  <!-- right panel title -->
  <text x="496" y="58" class="mono hud head" filter="url(#soft-glow)">toolchain</text>
  <text x="496" y="76" class="mono dim small">fieldwork, analysis, documentation, and publishing stack</text>

  <!-- tool badges -->
  <rect x="496" y="88" width="78" height="18" rx="3" class="box"/>
  <text x="510" y="101" class="mono hud small">stata</text>

  <rect x="582" y="88" width="96" height="18" rx="3" class="box"/>
  <text x="595" y="101" class="mono hud small">surveycto</text>

  <rect x="686" y="88" width="78" height="18" rx="3" class="box"/>
  <text x="700" y="101" class="mono hud small">nvivo</text>

  <rect x="772" y="88" width="78" height="18" rx="3" class="box"/>
  <text x="787" y="101" class="mono hud small">latex</text>

  <rect x="858" y="88" width="62" height="18" rx="3" class="box"/>
  <text x="873" y="101" class="mono hud small">git</text>

  <rect x="496" y="112" width="96" height="18" rx="3" class="box"/>
  <text x="509" y="125" class="mono hud small">markdown</text>

  <rect x="600" y="112" width="54" height="18" rx="3" class="box"/>
  <text x="614" y="125" class="mono hud small">r</text>

  <rect x="662" y="112" width="82" height="18" rx="3" class="box"/>
  <text x="676" y="125" class="mono hud small">html/css</text>

  <rect x="752" y="112" width="82" height="18" rx="3" class="box"/>
  <text x="767" y="125" class="mono hud small">github</text>

  <rect x="842" y="112" width="78" height="18" rx="3" class="box"/>
  <text x="855" y="125" class="mono hud small">mixed</text>

  <!-- compact matrix cluster for atmosphere only -->
  <text x="744" y="56" class="mono soft small">1 0 ア 1 0 1</text>
  <text x="810" y="68" class="mono faint small">0 1 ソ 0 1</text>
  <text x="738" y="80" class="mono soft small">1 テ 0 1 ム</text>

  <!-- footer -->
  <line x1="34" y1="162" x2="926" y2="162" class="line"/>
  <text x="40" y="172" class="mono faint tiny">STATUS: ACTIVE</text>
  <text x="182" y="172" class="mono faint tiny">MODE: RESEARCH + PUBLIC INTEREST BUILDING</text>
  <text x="544" y="172" class="mono faint tiny">OUTPUT: EVIDENCE · TOOLS · WRITING</text>

  <!-- scanline overlay -->
  <rect width="960" height="180" rx="12" fill="url(#scanlines)"/>
</svg>
