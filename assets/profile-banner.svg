  <title id="title">Md Mohsin Hossain profile banner</title>
  <desc id="desc">Hacker-style terminal banner for Md Mohsin Hossain.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a05"/>
      <stop offset="100%" stop-color="#080e08"/>
    </linearGradient>
    <radialGradient id="blob" cx="88%" cy="45%" r="32%">
      <stop offset="0%" stop-color="#003300" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#003300" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rain-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080e08" stop-opacity="1"/>
      <stop offset="100%" stop-color="#080e08" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0L0 0 0 40" fill="none" stroke="rgba(0,255,65,0.04)" stroke-width="0.5"/>
    </pattern>
    <pattern id="scan" x="0" y="0" width="960" height="4" patternUnits="userSpaceOnUse">
      <rect width="960" height="1" fill="rgba(0,0,0,0.1)"/>
    </pattern>
  </defs>

