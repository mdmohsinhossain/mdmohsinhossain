<svg xmlns="http://www.w3.org/2000/svg" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" viewBox="0 0 960 180" role="img" aria-labelledby="title desc">
  <title id="title">Terminal-style profile banner</title>
  <desc id="desc">A hacker-style terminal banner with matrix rain for mdmohsinhossain.</desc>

  <!-- Copyright (c) 2026 Md Mohsin Hossain. All rights reserved. -->
  <metadata>
    <rdf:RDF>
      <cc:Work rdf:about="">
        <dc:title>mdmohsinhossain terminal profile banner</dc:title>
        <dc:creator><cc:Agent><dc:title>Md Mohsin Hossain</dc:title></cc:Agent></dc:creator>
        <dc:rights><cc:Agent><dc:title>Md Mohsin Hossain</dc:title></cc:Agent></dc:rights>
        <dc:date>2026</dc:date>
        <dc:description>Original artwork by Md Mohsin Hossain (github.com/mdmohsinhossain). Unauthorized reproduction prohibited.</dc:description>
        <cc:license rdf:resource="http://creativecommons.org/licenses/by-nc-nd/4.0/"/>
      </cc:Work>
    </rdf:RDF>
  </metadata>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040804"/>
      <stop offset="100%" stop-color="#081108"/>
    </linearGradient>

    <radialGradient id="glow-bg" cx="82%" cy="30%" r="42%">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="rain-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060d06" stop-opacity="1"/>
      <stop offset="100%" stop-color="#060d06" stop-opacity="0"/>
    </linearGradient>

    <pattern id="micro-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#00ff41" stroke-opacity="0.035" stroke-width="0.6"/>
    </pattern>

    <pattern id="scanlines" x="0" y="0" width="960" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="960" height="1" fill="#000000" fill-opacity="0.10"/>
    </pattern>

    <filter id="soft-glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .mono { font-family: 'Courier New', Courier, monospace; }
      .bright { fill: #00ff41; }
      .mid { fill: #39d353; }
      .dim { fill: #1f7f35; }
      .faint { fill: #0f4f1f; }
      .line { stroke: #00ff41; stroke-opacity: 0.14; stroke-width: 1; }
      .tiny { font-size: 10px; letter-spacing: 1.4px; }
      .small { font-size: 13px; letter-spacing: 0.8px; }
      .main { font-size: 30px; font-weight: 700; letter-spacing: 0.5px; }
      .rain { font-size: 10px; fill: #00ff41; }
      .r1 { opacity: 0.78; }
      .r2 { opacity: 0.55; }
      .r3 { opacity: 0.35; }
      .r4 { opacity: 0.18; }
      .r5 { opacity: 0.08; }

      @keyframes rain-drop {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      @keyframes rain-drop-b {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      @keyframes shimmer {
        0%, 100% { opacity: 0.8; }
        40% { opacity: 1; }
        70% { opacity: 0.5; }
      }
      @keyframes scan-drift {
        0%   { transform: translateY(0); }
        100% { transform: translateY(4px); }
      }
      @keyframes status-pulse {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 0.9; }
      }
      @keyframes corner-blink {
        0%, 88%, 100% { opacity: 0.55; }
        94% { opacity: 0; }
      }

      .col-a { animation: rain-drop 3.8s ease-in-out infinite; }
      .col-b { animation: rain-drop-b 4.2s ease-in-out infinite; }
      .col-c { animation: rain-drop 5s ease-in-out 1.2s infinite; }
      .col-d { animation: rain-drop-b 3.5s ease-in-out 0.6s infinite; }
      .head-shimmer { animation: shimmer 2.8s ease-in-out infinite; }
      .scan-overlay { animation: scan-drift 3s linear infinite; }
      .status-live { animation: status-pulse 3s ease-in-out infinite; }
      .corner-pulse { animation: corner-blink 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- background -->
  <rect width="960" height="180" rx="12" fill="url(#bg)"/>
  <rect width="960" height="180" rx="12" fill="url(#micro-grid)"/>
  <rect width="960" height="180" rx="12" fill="url(#glow-bg)"/>

  <!-- frame -->
  <rect x="1" y="1" width="958" height="178" rx="11" fill="none" stroke="#00ff41" stroke-opacity="0.20" stroke-width="1"/>
  <rect x="6" y="6" width="948" height="168" rx="8" fill="none" stroke="#00ff41" stroke-opacity="0.05" stroke-width="1"/>

  <!-- corner marks + dots -->
  <path d="M18 34V18H34" fill="none" stroke="#00ff41" stroke-opacity="0.45" stroke-width="1.4"/>
  <path d="M926 18H942V34" fill="none" stroke="#00ff41" stroke-opacity="0.45" stroke-width="1.4"/>
  <path d="M18 146V162H34" fill="none" stroke="#00ff41" stroke-opacity="0.45" stroke-width="1.4"/>
  <path d="M926 162H942V146" fill="none" stroke="#00ff41" stroke-opacity="0.45" stroke-width="1.4"/>
  <circle cx="18" cy="18" r="2" fill="#00ff41" class="corner-pulse"/>
  <circle cx="942" cy="18" r="2" fill="#00ff41" opacity="0.5"/>
  <circle cx="18" cy="162" r="2" fill="#00ff41" opacity="0.5"/>
  <circle cx="942" cy="162" r="2" fill="#00ff41" class="corner-pulse"/>

  <!-- header -->
  <text x="36" y="30" class="mono faint tiny">// TERMINAL PROFILE · CLEAN SIGNAL · MINIMAL MODE</text>
  <line x1="36" y1="38" x2="924" y2="38" class="line"/>

  <!-- main terminal line -->
  <text x="52" y="92" class="mono main" filter="url(#soft-glow)">
    <tspan class="mid">guest@github:~$</tspan>
    <tspan class="bright"> ./mdmohsinhossain</tspan>
  </text>

  <!-- cursor with glow -->
  <rect x="650" y="68" width="14" height="26" fill="#00ff41" opacity="0.2" filter="url(#soft-glow)">
    <animate attributeName="opacity" values="0.2;0;0.2" dur="1.15s" repeatCount="indefinite"/>
  </rect>
  <rect x="650" y="68" width="14" height="26" fill="#00ff41">
    <animate attributeName="opacity" values="1;0;1" dur="1.15s" repeatCount="indefinite"/>
  </rect>

  <!-- sublines -->
  <text x="54" y="118" class="mono mid small">climate · migration · policy · digital literacy</text>
  <text x="54" y="141" class="mono dim small">mixed methods · public-interest tools · research workflow</text>

  <!-- matrix rain zone (x=706 to x=934) -->
  <!-- left-edge fade mask -->
  <rect x="696" y="0" width="48" height="180" fill="url(#rain-fade)"/>

  <!-- column 1 (x=710) -->
  <g class="col-a">
    <text x="710" y="22" class="mono rain r1 head-shimmer">1</text>
    <text x="710" y="34" class="mono rain r2">0</text>
    <text x="710" y="46" class="mono rain r3">ア</text>
    <text x="710" y="58" class="mono rain r4">1</text>
    <text x="710" y="70" class="mono rain r5">0</text>
  </g>
  <!-- column 2 (x=726) -->
  <g class="col-b">
    <text x="726" y="28" class="mono rain r1 head-shimmer">ウ</text>
    <text x="726" y="40" class="mono rain r2">0</text>
    <text x="726" y="52" class="mono rain r3">1</text>
    <text x="726" y="64" class="mono rain r4">ソ</text>
    <text x="726" y="76" class="mono rain r5">0</text>
  </g>
  <!-- column 3 (x=742) -->
  <g class="col-c">
    <text x="742" y="18" class="mono rain r2">0</text>
    <text x="742" y="30" class="mono rain r1 head-shimmer">テ</text>
    <text x="742" y="42" class="mono rain r2">1</text>
    <text x="742" y="54" class="mono rain r3">0</text>
    <text x="742" y="66" class="mono rain r4">1</text>
    <text x="742" y="78" class="mono rain r5">0</text>
  </g>
  <!-- column 4 (x=758) -->
  <g class="col-d">
    <text x="758" y="24" class="mono rain r1 head-shimmer">ネ</text>
    <text x="758" y="36" class="mono rain r2">1</text>
    <text x="758" y="48" class="mono rain r3">0</text>
    <text x="758" y="60" class="mono rain r4">ム</text>
    <text x="758" y="72" class="mono rain r5">1</text>
  </g>
  <!-- column 5 (x=774) -->
  <g class="col-a">
    <text x="774" y="20" class="mono rain r2">1</text>
    <text x="774" y="32" class="mono rain r1 head-shimmer">イ</text>
    <text x="774" y="44" class="mono rain r2">0</text>
    <text x="774" y="56" class="mono rain r3">1</text>
    <text x="774" y="68" class="mono rain r4">カ</text>
    <text x="774" y="80" class="mono rain r5">0</text>
  </g>
  <!-- column 6 (x=790) -->
  <g class="col-b">
    <text x="790" y="26" class="mono rain r1 head-shimmer">エ</text>
    <text x="790" y="38" class="mono rain r2">0</text>
    <text x="790" y="50" class="mono rain r3">1</text>
    <text x="790" y="62" class="mono rain r4">0</text>
    <text x="790" y="74" class="mono rain r5">ア</text>
  </g>
  <!-- column 7 (x=806) -->
  <g class="col-c">
    <text x="806" y="22" class="mono rain r2">0</text>
    <text x="806" y="34" class="mono rain r1 head-shimmer">ソ</text>
    <text x="806" y="46" class="mono rain r2">1</text>
    <text x="806" y="58" class="mono rain r3">0</text>
    <text x="806" y="70" class="mono rain r5">テ</text>
  </g>
  <!-- column 8 (x=822) -->
  <g class="col-d">
    <text x="822" y="18" class="mono rain r1 head-shimmer">1</text>
    <text x="822" y="30" class="mono rain r2">0</text>
    <text x="822" y="42" class="mono rain r3">ウ</text>
    <text x="822" y="54" class="mono rain r4">1</text>
    <text x="822" y="66" class="mono rain r5">0</text>
  </g>
  <!-- column 9 (x=838) -->
  <g class="col-a">
    <text x="838" y="25" class="mono rain r1 head-shimmer">ム</text>
    <text x="838" y="37" class="mono rain r2">1</text>
    <text x="838" y="49" class="mono rain r3">0</text>
    <text x="838" y="61" class="mono rain r4">ネ</text>
    <text x="838" y="73" class="mono rain r5">1</text>
  </g>
  <!-- column 10 (x=854) -->
  <g class="col-b">
    <text x="854" y="21" class="mono rain r2">0</text>
    <text x="854" y="33" class="mono rain r1 head-shimmer">イ</text>
    <text x="854" y="45" class="mono rain r2">0</text>
    <text x="854" y="57" class="mono rain r3">1</text>
    <text x="854" y="69" class="mono rain r4">カ</text>
    <text x="854" y="81" class="mono rain r5">0</text>
  </g>
  <!-- column 11 (x=870) -->
  <g class="col-c">
    <text x="870" y="27" class="mono rain r1 head-shimmer">エ</text>
    <text x="870" y="39" class="mono rain r2">1</text>
    <text x="870" y="51" class="mono rain r3">ア</text>
    <text x="870" y="63" class="mono rain r4">0</text>
    <text x="870" y="75" class="mono rain r5">1</text>
  </g>
  <!-- column 12 (x=886) -->
  <g class="col-d">
    <text x="886" y="23" class="mono rain r1 head-shimmer">1</text>
    <text x="886" y="35" class="mono rain r2">ソ</text>
    <text x="886" y="47" class="mono rain r3">0</text>
    <text x="886" y="59" class="mono rain r4">1</text>
    <text x="886" y="71" class="mono rain r5">テ</text>
  </g>

  <!-- footer -->
  <line x1="36" y1="156" x2="924" y2="156" stroke="url(#accent-line)" stroke-width="1"/>
  <text x="40" y="170" class="mono faint tiny status-live">STATUS: ONLINE</text>
  <text x="188" y="170" class="mono faint tiny">MODE: ELEGANT_HACKER</text>
  <text x="420" y="170" class="mono faint tiny">OUTPUT: RESEARCH · TOOLS · WRITING</text>

  <!-- watermark -->
  <text x="920" y="174" class="mono" font-size="6" fill="#00ff41" opacity="0.06" text-anchor="end">mdmohsinhossain</text>

  <!-- scanlines -->
  <rect width="960" height="180" rx="12" fill="url(#scanlines)" class="scan-overlay"/>
</svg>
